spring.application.name=SentimentEngine
server.servlet.context-path=/api
spring.output.ansi.enabled=ALWAYS
# Database Config
spring.datasource.url=jdbc:mysql://localhost:3306/sentiment_engine?useSSL=false&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false
flyway.clean=false
# Artemis Config
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=
spring.artemis.password=
internal.buffer.queue.name=event-buffer-queue
# Gen AI Config
genai.provider=openai
# OpenAI
genai.openai.api-key=
genai.openai.model=gpt-4o-mini
genai.openai.url=https://api.openai.com/v1/chat/completions
genai.openai.temperature=0.4
# Gemini
genai.gemini.api-key=
genai.gemini.model=gemini-3.5-flash
genai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models
# Absence detection
absence.check.job.enabled=true
absence.check-interval-ms=60000
absence.check.on.arrival.enabled=true
#50 min
absence.threshold-ms.global=3000000
# 12h
#absence.threshold-ms.global=43200000
absence.threshold-ms.per-type=600000
#   EVENT_TIME  -> "now" = latest ingested event timestamp (use for data dumps)
#   REAL_TIME  -> "now" = real system clock (use for live real-time data)
absence.clock-mode=EVENT_TIME
# Rule generation
rulegen.max-retries=3
rulegen.retry-delay-ms=1000
rulegen.auto.enabled=true
rulegen.job.enabled=true
rulegen.job.interval-ms=300000
#Data Dump
events.datasource.gh-archive.directory.path=
events.datasource.gh-archive.file.path=

# Actuator / Prometheus Metrics
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=SentimentEngine
management.metrics.distribution.percentiles-histogram.all=true
management.metrics.distribution.percentiles.all=0.5,0.95,0.99
# Reevaluate Events
reevaluation.job.enabled=true
reevaluation.job.interval-ms=300000